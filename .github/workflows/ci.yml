name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ローカル Supabase の既定値。supabase/config.toml と対になっている公開既知の
  # デモ用キーであり、秘密情報ではない。
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  # 組織切替が app_metadata を更新するのに使う（Auth Admin API 専用）。
  # 上と同じくローカル Supabase の公開既知デモキー。本番は Vercel の
  # 環境変数に実キーを設定する（docs/deployment.md）。
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  # DB を必要としない検査。速いのでこちらを先に回して早期に落とす。
  quality:
    name: Lint / Typecheck / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # AGENTS.md に文章で書いてある規約と、設計書と実装の同期を機械的に検査する。
      # lint / typecheck / テストのどれも見ない領域（RLS 未設定、loading/error の
      # 欠落、画面一覧の遅れ、ドキュメントのリンク切れ等）が対象。
      - name: Convention audit
        run: pnpm check:conventions

      - name: Typecheck
        run: pnpm typecheck

      # カバレッジ閾値は vitest.config.ts の coverage.thresholds で定義している。
      # 下回ると vitest が非ゼロ終了するため、ここが回帰の防波堤になる。
      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # 実 DB / 実ブラウザを要する検査。Supabase を起動してから回す。
  integration:
    name: RLS / E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # バージョンを固定する。`latest` だと上流の npm パッケージが壊れた日に
      # CI 全体が落ちる（2026-08-18 に
      # `No matching Supabase CLI binary package found for linux-x64` で
      # 複数の PR が失敗した。コード変更を含まない docs PR でも落ちたため
      # 上流起因と判断できる）。
      # 上げるときは意図的に上げる。
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      # マイグレーション適用と supabase/seed.sql の投入もここで行われる
      - name: Start Supabase
        run: supabase start

      - name: Integration tests
        run: pnpm test:integration

      - name: RLS tests
        run: pnpm test:rls

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
