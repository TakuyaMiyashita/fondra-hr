# 検証環境の死活確認。
#
# アプリの外側から `/api/health` を叩き、HTTP ステータスと本文の両方を検査する。
#
# **定期実行はしない。** 検証環境（ADR 0005）は Supabase の無料枠にあり、
# 7日間使われないと自動で一時停止する。眠るように作られた環境を常時監視すると、
# 出てくるのは異常ではなく「今日も眠っている」という通知だけになる。
# 判断の経緯は docs/adr/0017-health-check-is-on-demand-only.md。
name: Health Check

on:
  # デプロイ後の確認用。手で叩く。
  workflow_dispatch:

  # このワークフロー自身を変更する PR では、そのブランチの内容で疎通だけ試す。
  pull_request:
    paths:
      - '.github/workflows/health-check.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 既定値はリポジトリ変数 HEALTH_CHECK_URL で上書きできる。
      # 未設定でも動くよう既定値を直書きしている。この URL は README が
      # デモ環境として公開しているものであり、秘密情報ではない。
      HEALTH_URL: ${{ vars.HEALTH_CHECK_URL || 'https://fondra-hr-staging.vercel.app' }}

    steps:
      - name: Probe
        id: probe
        run: |
          set -uo pipefail
          url="${HEALTH_URL%/}/api/health"
          echo "probing ${url}"

          healthy=false
          detail=''

          # 1回の失敗では落とさない。サーバーレスのコールドスタート、
          # Vercel 側の一時的な 5xx、DNS の揺れがあるため、
          # 1回の結果で「落ちている」と判断しない。
          for attempt in 1 2 3; do
            # 前回の応答が残っていると、接続できなかった回に古い本文が
            # 「最終応答」として報告される。毎回空にしてから叩く
            # （rm ではなく空ファイルを作る。curl が応答を書かずに終わっても
            #   後段のリダイレクトが「ファイルが無い」で騒がないように）。
            : >body.txt
            code=$(curl -sS --max-time 20 -o body.txt -w '%{http_code}' "${url}" || true)
            code=${code:-000}
            body=$(tr -d '\r\n' <body.txt 2>/dev/null | head -c 300 || true)
            echo "attempt ${attempt}: http=${code} body=${body}"

            # ステータスコードだけでは足りない。
            #  - 認証必須に戻ると 307 で /login へ飛ぶ（PUBLIC_PATHS の退行）
            #  - 別プロジェクトを指していると 200 で HTML が返る
            # 本文まで見て初めて「このアプリが DB まで到達できている」と言える。
            if [ "${code}" = "200" ] &&
              printf '%s' "${body}" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' &&
              printf '%s' "${body}" | grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"'; then
              healthy=true
              detail="http=${code} body=${body}"
              break
            fi

            detail="http=${code} body=${body}"
            if [ "${attempt}" -lt 3 ]; then sleep 30; fi
          done

          {
            echo "healthy=${healthy}"
            echo "detail=${detail}"
            echo "url=${url}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### 死活確認"
            echo ""
            echo "- URL: \`${url}\`"
            echo "- 健全: **${healthy}**"
            echo "- 最終応答: \`${detail}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      # 応答が健全でなければジョブを失敗させる。手で叩いた人がその場で気づく。
      - name: Fail the job when unhealthy
        if: steps.probe.outputs.healthy != 'true'
        env:
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          echo "health check failed: ${DETAIL}"
          exit 1
